name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install fastapi uvicorn pydantic pytest httpx chromadb langchain-huggingface sentence-transformers google-genai python-dotenv langchain-text-splitters
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -v

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rag-physics-api .